<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Abstract night city with routes moving through it">
  <!--
    The hero background.

    Drawn rather than photographed, for two reasons: the site loads nothing
    over the network, and a stock photograph of a city says nothing about what
    the company does. This is a road network at night with traffic moving along
    it — which is literally the thing both products are about.

    To use a real photograph instead, drop the file in beside this one and
    change --hero-image in index.html. Nothing else needs to move.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#0E1420"/>
      <stop offset="45%"  stop-color="#0A0E16"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <radialGradient id="glowA" cx="18%" cy="22%" r="52%">
      <stop offset="0%"   stop-color="#2B6CF6" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#2B6CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="84%" cy="16%" r="46%">
      <stop offset="0%"   stop-color="#7FC0F5" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#7FC0F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="70%" cy="92%" r="55%">
      <stop offset="0%"   stop-color="#6D3BD4" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#6D3BD4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FC0F5" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#9FD4FF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#7FC0F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#D3FF00" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#D3FF00" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#D3FF00" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <rect width="1600" height="900" fill="url(#glowC)"/>

  <!-- the road grid, in perspective -->
  <g stroke="#8FA6C4" stroke-opacity=".13" stroke-width="1" fill="none">
    <path d="M-100 640 L1700 470"/>
    <path d="M-100 720 L1700 545"/>
    <path d="M-100 812 L1700 628"/>
    <path d="M-100 560 L1700 402"/>
    <path d="M120 900 L470 300"/>
    <path d="M420 900 L690 300"/>
    <path d="M760 900 L905 300"/>
    <path d="M1120 900 L1140 300"/>
    <path d="M1460 900 L1370 300"/>
  </g>

  <!-- junction nodes -->
  <g fill="#9FD4FF" fill-opacity=".5">
    <circle cx="470" cy="637" r="2.6"/><circle cx="691" cy="616" r="2.6"/>
    <circle cx="905" cy="596" r="2.6"/><circle cx="1139" cy="574" r="2.6"/>
    <circle cx="606" cy="546" r="2.2"/><circle cx="838" cy="524" r="2.2"/>
    <circle cx="1132" cy="497" r="2.2"/><circle cx="365" cy="568" r="2.2"/>
  </g>

  <!-- traffic moving along the routes -->
  <g filter="url(#soft)">
    <rect x="180"  y="632"  width="320" height="3.5" rx="1.75" fill="url(#trail)"/>
    <rect x="820"  y="605"  width="420" height="3.5" rx="1.75" fill="url(#trail)"/>
    <rect x="420"  y="714"  width="380" height="3.5" rx="1.75" fill="url(#trail2)"/>
    <rect x="1080" y="700"  width="300" height="3"   rx="1.5"  fill="url(#trail)"/>
    <rect x="240"  y="806"  width="440" height="3"   rx="1.5"  fill="url(#trail)"/>
    <rect x="900"  y="800"  width="360" height="3"   rx="1.5"  fill="url(#trail2)"/>
    <rect x="520"  y="552"  width="260" height="2.6" rx="1.3"  fill="url(#trail)"/>
  </g>

  <!-- skyline, kept very low contrast so headline type stays readable -->
  <g fill="#0B1018" fill-opacity=".85">
    <rect x="60"   y="392" width="74"  height="220"/>
    <rect x="150"  y="330" width="52"  height="282"/>
    <rect x="214"  y="428" width="66"  height="184"/>
    <rect x="1290" y="356" width="60"  height="256"/>
    <rect x="1362" y="300" width="78"  height="312"/>
    <rect x="1452" y="404" width="56"  height="208"/>
  </g>
  <g fill="#9FD4FF" fill-opacity=".16">
    <rect x="76"   y="410" width="8" height="8"/><rect x="96" y="440" width="8" height="8"/>
    <rect x="164"  y="352" width="8" height="8"/><rect x="182" y="392" width="8" height="8"/>
    <rect x="1306" y="376" width="8" height="8"/><rect x="1326" y="420" width="8" height="8"/>
    <rect x="1380" y="322" width="8" height="8"/><rect x="1404" y="368" width="8" height="8"/>
  </g>

  <!-- ground fade, so the section below joins without a seam -->
  <rect x="0" y="620" width="1600" height="280" fill="#07090E" opacity=".55"/>
  <rect x="0" y="820" width="1600" height="80"  fill="#07090E"/>
</svg>
