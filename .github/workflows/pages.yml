# Deploys the folder to GitHub Pages as-is.
#
# The legacy "pages build and deployment" builder stands up a whole Jekyll
# environment even for plain HTML, and it was overrunning the 10-minute limit —
# two builds were killed at 10m44s and 11m01s. This workflow just uploads the
# directory and publishes it, which is all a static site needs, and finishes in
# well under a minute.
#
# Requires: Settings → Pages → Source = "GitHub Actions".

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
