<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gigzen">
  <title>Gigzen</title>
  <!--
    Traced from the master artwork (Gigzen Logo.png) rather than drawn by eye:
    alpha mask -> Moore-neighbour boundary -> Douglas-Peucker at 3px -> 20
    vertices, normalised into a 64-unit box.

    Four earlier hand-drawn attempts all missed the same detail — the G's arm is
    a wedge that tapers to a point on the left, not a bar with a cut end.

    One closed path, no mask: the counter reaches the outside through the G's
    mouth, so the shape is simply connected and inherits colour from its
    container.
  -->
  <defs>
    <linearGradient id="gzBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FB4F5"/>
      <stop offset=".55" stop-color="#2E7FE0"/>
      <stop offset="1" stop-color="#0038B8"/>
    </linearGradient>
  </defs>
  <path d="M33.19 2 L60.1 14.82 L48.54 20.68 L33.66 13.4 L16.25 23.06 L15.14 23.85 L15.14 40.15 L33.19 47.91 L49.02 39.84 L49.34 38.73 L48.54 38.25 L30.34 33.66 L30.5 30.97 L44.43 24.01 L61.05 29.86 L61.05 46.64 L33.5 62 L2.95 46.64 L2.95 17.51 L33.03 2.16 Z" fill="url(#gzBlue)"/>
</svg>
