<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gigzen">
  <title>Gigzen</title>
  <!--
    The hexagonal ring IS the G: a thick band, a slot cut into its right side to
    open the letter, and a tongue pointing inward beneath the slot.

    Composed as: (outer hexagon AND NOT inner hexagon AND NOT slot) OR tongue.
    The base path is the outer hexagon, so everything is clipped to it and the
    mark inherits colour from its container.

    Geometry rasterised at 256 / 32 / 16px before being written here.
  -->
  <defs>
    <mask id="gigzen-g">
      <rect width="64" height="64" fill="#fff"/>
      <!-- inner hexagon: hollows the band -->
      <path d="M32 15 L46.72 23.5 V40.5 L32 49 L17.28 40.5 V23.5 Z" fill="#000"/>
      <!-- slot: the G's mouth, cut through the right of the band -->
      <rect x="30" y="25.5" width="34" height="7.5" fill="#000"/>
      <!-- tongue: the bar that turns a C into a G -->
      <rect x="33.5" y="33" width="13.5" height="7" fill="#fff"/>
    </mask>
  </defs>
  <path d="M32 2 L57.98 17 V47 L32 62 L6.02 47 V17 Z"
        fill="currentColor" mask="url(#gigzen-g)"/>
</svg>
