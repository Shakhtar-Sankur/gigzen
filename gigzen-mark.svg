<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gigzen">
  <title>Gigzen</title>
  <!--
    The hexagonal ring IS the G: a band, a slot cut into its right side to open
    the letter, and an arm pointing inward beneath the slot.

    Composed as: (outer hexagon AND NOT inner hexagon AND NOT slot) OR arm.
    The base path is the outer hexagon, so everything is clipped to it and the
    mark inherits colour from its container.

    Rasterised at 256 / 32 / 16px at each step. Two things were corrected along
    the way: the construction was originally inverted (a solid hexagon with a
    hole), and a chamfered arm tip read as an arrowhead rather than a G.
  -->
  <defs>
    <mask id="gigzen-g">
      <rect width="64" height="64" fill="#fff"/>
      <!-- inner hexagon: hollows the band -->
      <path d="M32 12.5 L48.89 22.25 V41.75 L32 51.5 L15.11 41.75 V22.25 Z" fill="#000"/>
      <!-- slot: the G's mouth -->
      <rect x="29" y="26" width="35" height="6" fill="#000"/>
      <!-- arm: what turns a C into a G -->
      <rect x="32.5" y="32" width="17.5" height="6.5" fill="#fff"/>
    </mask>
  </defs>
  <path d="M32 2 L57.98 17 V47 L32 62 L6.02 47 V17 Z"
        fill="currentColor" mask="url(#gigzen-g)"/>
</svg>
